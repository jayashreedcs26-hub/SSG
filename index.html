<body>
    <h1><b>Student Registration Form</b></h1>
    <label>Full Name :</label>
    <input type="text" placeholder="Enter your name"><br><br>
    <label>Email :</label>

    <label>CSS</label>
    <input type="radio" name="skill">

    <button>Submit</button>
    <button>Save</button>
    <button>Reset</button><br><br>
